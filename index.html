<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>我的旅行行程</title>
<style>
  /* 這裡保留你原本的 CSS 樣式 */
  body { font-family: sans-serif; background: #F4F6F8; }
  .app { max-width: 520px; margin: 0 auto; padding: 20px; }
  .empty { text-align: center; color: #5C7089; }
</style>
</head>
<body>
<div class="app" id="app">載入中...</div>

<script>
let trips = [];
let activeTripIdx = 0;
let activeDayIdx = 0;

// 修正後的讀取函數
async function loadTrips() {
  const app = document.getElementById('app');
  try {
    const response = await fetch('./trips.json');
    if (!response.ok) throw new Error('找不到 trips.json');
    const data = await response.json();
    trips = data;
    if (trips.length > 0) {
      render();
    } else {
      app.innerHTML = '<div class="empty">行程清單是空的。</div>';
    }
  } catch (e) {
    app.innerHTML = '<div class="empty">讀取失敗：' + e.message + '</div>';
    console.error(e);
  }
}

function render() {
  // 這裡放入你原本的 render 函式邏輯
  const app = document.getElementById('app');
  app.innerHTML = '<h2>' + trips[activeTripIdx].title + '</h2>';
  // ... (保留你原本完整的 render 內容)
}

loadTrips();
</script>
</body>
</html>
